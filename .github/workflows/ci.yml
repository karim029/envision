name: CI

on:
  push:
  pull_request:
    branches: [main]

# A new push cancels the older run for the same branch.
# event_name keeps push runs and PR runs in separate groups so they don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Throwaway Postgres for integration tests (same major version as Supabase).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: envision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d envision_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/envision_test
      # Required by src/env.ts at build time. The build never connects to it.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/envision_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node (version from package.json engines)
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cheapest checks first so the run fails fast.
      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (migrations + real Postgres)
        run: npm run test:integration

      - name: Build
        run: npm run build
