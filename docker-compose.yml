# Local development + integration-test database.
# Postgres 17 matches the version Supabase runs.
# Host port 5433 avoids clashing with any Postgres already on 5432.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local only, never used outside this container
      POSTGRES_DB: envision
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d envision"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
